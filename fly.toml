# fly.toml app configuration file generated for fitlog-chris on 2026-07-24T13:21:50+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fitlog-chris'
primary_region = 'bom'

[build]

[env]
  DB_PATH = '/data/fitness.db'
  PORT = '8080'

[[mounts]]
  source = 'fitlog_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
